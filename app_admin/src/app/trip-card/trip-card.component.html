<article class="card h-100 shadow-sm">
  <img class="card-img-top trip-photo" [src]="'images/' + trip.image" [alt]="trip.name">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <h2 class="card-title h5">{{ trip.name }}</h2>
      <span class="badge text-bg-secondary">{{ trip.code }}</span>
    </div>
    <p class="card-subtitle text-muted mb-2">{{ trip.resort }}</p>
    <p *ngIf="trip.location" class="small text-muted mb-2">{{ trip.location }} · {{ trip.category }}</p>
    <p class="small mb-2">{{ trip.length }} · Starts {{ trip.start | date:'mediumDate' }}</p>
    <p class="fw-semibold mb-2">{{ trip.perPerson | currency:'USD':'symbol' }} per person</p>
    <p class="card-text flex-grow-1">{{ trip.description }}</p>
    <div *ngIf="auth.isAdmin()" class="d-flex gap-2 mt-2">
      <a class="btn btn-outline-primary btn-sm" [routerLink]="['/edit', trip.code]">Edit trip</a>
      <button class="btn btn-outline-danger btn-sm" type="button" (click)="deleteRequested.emit(trip.code)">Delete</button>
    </div>
  </div>
</article>
