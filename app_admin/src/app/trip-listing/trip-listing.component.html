<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
  <div>
    <h1 class="page-heading mb-1">Trip listing</h1>
    <p class="text-muted mb-0">View and manage Travlr Getaways trips.</p>
  </div>
  <a *ngIf="auth.isAdmin()" class="btn btn-primary" routerLink="/add">Add a trip</a>
</div>

<div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
<div *ngIf="loading" class="alert alert-info" role="status">Loading trips...</div>
<div *ngIf="!loading && !trips.length && !error" class="alert alert-info">No trips are available yet.</div>

<p *ngIf="!loading && trips.length" class="small text-muted">{{ trips.length }} trips available</p>
<div class="row g-4" *ngIf="!loading && trips.length">
  <div class="col-12 col-md-6 col-lg-4" *ngFor="let trip of trips">
    <app-trip-card [trip]="trip" (deleteRequested)="deleteTrip($event)"></app-trip-card>
  </div>
</div>
