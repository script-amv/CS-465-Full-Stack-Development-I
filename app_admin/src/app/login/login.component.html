<div class="card shadow-sm mx-auto" style="max-width: 480px">
  <div class="card-body p-4">
    <h1 class="h2 mb-2">Admin login</h1>
    <p class="text-muted">Sign in to add, edit, or delete trips.</p>
    <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>
    <form #loginForm="ngForm" (ngSubmit)="onLoginSubmit(loginForm)" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="username" required email maxlength="254" [(ngModel)]="credentials.email">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required maxlength="128" [(ngModel)]="credentials.password">
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit" [disabled]="submitted">{{ submitted ? 'Signing in...' : 'Sign in' }}</button>
        <a class="btn btn-outline-secondary" routerLink="/">Cancel</a>
      </div>
    </form>
  </div>
</div>
